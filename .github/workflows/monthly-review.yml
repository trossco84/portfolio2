name: Monthly Portfolio Deep-Dive

on:
  schedule:
    # Run on first Monday of every month at 10 AM UTC (2 AM PST / 5 AM EST)
    # Note: GitHub Actions doesn't have "first Monday" syntax, so we run every Monday
    # and the script will check if it's the first Monday
    - cron: '0 10 * * 1'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'

jobs:
  monthly-review:
    runs-on: ubuntu-latest
    # Only run on first Monday of month (day 1-7)
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule && github.event.schedule[0].cron == '0 10 * * 1' && github.event.repository.pushed_at)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if first Monday
        id: check_date
        run: |
          # Get day of month
          DAY=$(date +%d | sed 's/^0*//')
          # First Monday is between day 1-7
          if [ $DAY -le 7 ]; then
            echo "is_first_monday=true" >> $GITHUB_OUTPUT
            echo "✓ This is the first Monday of the month (day $DAY)"
          else
            echo "is_first_monday=false" >> $GITHUB_OUTPUT
            echo "⏭ Not the first Monday (day $DAY), skipping..."
          fi

      - name: Set up Python
        if: steps.check_date.outputs.is_first_monday == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_date.outputs.is_first_monday == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run monthly deep-dive
        if: steps.check_date.outputs.is_first_monday == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          TOTAL_CAPITAL: ${{ secrets.TOTAL_CAPITAL }}
          CASH_RESERVE: ${{ secrets.CASH_RESERVE }}
          SLEEVE_CAPITAL: ${{ secrets.SLEEVE_CAPITAL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          # Create reports directory
          mkdir -p reports
          # Run monthly analysis
          python scripts/monthly_review.py

      - name: Upload monthly report
        if: (steps.check_date.outputs.is_first_monday == 'true' || github.event_name == 'workflow_dispatch') && always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-report-${{ github.run_number }}
          path: reports/
          retention-days: 365  # Keep monthly reports for 1 year
          if-no-files-found: warn
