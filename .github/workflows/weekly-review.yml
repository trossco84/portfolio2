name: Weekly Portfolio Review

on:
  schedule:
    # Run every Monday at 9 AM UTC (1 AM PST / 4 AM EST)
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'

jobs:
  weekly-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run weekly review
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          TOTAL_CAPITAL: ${{ secrets.TOTAL_CAPITAL }}
          CASH_RESERVE: ${{ secrets.CASH_RESERVE }}
          SLEEVE_CAPITAL: ${{ secrets.SLEEVE_CAPITAL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python scripts/weekly_review.py --auto-execute

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-reports-${{ github.run_number }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
