# Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "portfolio-dashboard"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Cheapest configuration: shared-cpu-1x with 256MB RAM
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
